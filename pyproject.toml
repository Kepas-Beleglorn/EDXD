[project]
name = "ed-eXploration-dashboard"
version = "0.9.1.1"
description = "Elite Dangerous eXploration Dashboard"
authors = [{ name = "Kepas Beleglorn", email = "Kepas-Beleglorn@users.noreply.github.com" }]
readme = "README.md"
license = 'CC-BY-NC-4.0'
requires-python = ">=3.14"
dependencies = [
    "watchdog",
    "wxPython>=4.2.5,<5",
    "tomli",
    "filelock",
    "requests"
]

[project.scripts]
ed-eXploration-dashboard = "EDXD.main:main"

[tool.setuptools.packages.find]
include = ["EDXD*"]
exclude = ["EDXD/resources*"]

