name: Update Discord release message

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          else
            release_json=$(jq -c '.release' "$GITHUB_EVENT_PATH")
          fi

          {
            echo "tag_name=$(jq -r '.tag_name' <<< "$release_json")"
            echo "html_url=$(jq -r '.html_url' <<< "$release_json")"
            echo "body_b64=$(jq -r '(.body // "") | @base64' <<< "$release_json")"
          } >> "$GITHUB_OUTPUT"

      - name: Build Discord payload
        id: payload
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_URL: ${{ steps.release.outputs.html_url }}
          RELEASE_BODY_B64: ${{ steps.release.outputs.body_b64 }}
        run: |
          desc=$(printf '%s' "$RELEASE_BODY_B64" | base64 --decode)

          # Discord embed descriptions are limited to 4096 characters.
          desc_length=$(jq -nr --arg desc "$desc" '$desc | length')
          if (( desc_length > 4096 )); then
            echo "::warning::Release notes are ${desc_length} characters; truncating the embed description to Discord's 4096-character limit."
            desc=$(jq -nr --arg desc "$desc" '$desc[:4000] + "..."')
          fi

          jq -n \
            --arg title "EDXD $RELEASE_TAG released" \
            --arg url "$RELEASE_URL" \
            --arg desc "$desc" \
            '{
              content: "",
              embeds: [{
                title: $title,
                url: $url,
                description: $desc
              }]
            }' > payload.json

      - name: Edit pinned Discord message
        env:
          WEBHOOK_ANNOUNCEMENT_URL: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCE_URL }}
          WEBHOOK_PINNED_URL: ${{ secrets.DISCORD_WEBHOOK_PINNED_URL }}
          MESSAGE_PINNED_ID: ${{ secrets.DISCORD_MESSAGE_ID }}
        run: |
          curl -X PATCH \
               -H "Content-Type: application/json" \
               -d @payload.json \
               "$WEBHOOK_PINNED_URL/messages/$MESSAGE_PINNED_ID"

          curl -X POST \
               -H "Content-Type: application/json" \
               -d @payload.json \
               "$WEBHOOK_ANNOUNCEMENT_URL"
          
